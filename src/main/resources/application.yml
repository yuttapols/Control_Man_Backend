spring:
  application:
    name: control-m-backend
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    url: ${FLYWAY_URL:${DATABASE_URL}}
    user: ${FLYWAY_USERNAME:${DATABASE_USERNAME}}
    password: ${FLYWAY_PASSWORD:${DATABASE_PASSWORD}}
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-stacktrace: never
    include-message: never

app:
  environment: ${APP_ENV:LOCAL}
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
  auth:
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
    refresh-idle-timeout: ${REFRESH_IDLE_TIMEOUT:24h}
  auth-web:
    cookie-domain: ${REFRESH_COOKIE_DOMAIN:}
    secure-cookie: ${REFRESH_COOKIE_SECURE:true}
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENV:LOCAL}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    # This resolver includes exception messages at DEBUG, which may contain submitted secrets.
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
    json:
      add:
        service: ${spring.application.name}
        environment: ${APP_ENV:LOCAL}
